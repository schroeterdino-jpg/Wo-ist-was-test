<!-- CENTER ARC REACTOR / LARGE JARVIS ORB BUTTON -->
<div class="relative flex flex-col items-center justify-center my-6">
  <button id="orb-button" onclick="if(typeof toggleVoiceInput === 'function') toggleVoiceInput();" class="relative group outline-none focus:outline-none border-none bg-transparent cursor-pointer flex items-center justify-center">
    
    <!-- Rotierender Außenring -->
    <div class="orb-rotating-ring absolute w-[260px] h-[260px] md:w-[320px] md:h-[320px] rounded-full border-2 border-dashed border-cyan-400/40 pointer-events-none"></div>
    <div class="orb-rotating-ring-reverse absolute w-[280px] h-[280px] md:w-[340px] md:h-[340px] rounded-full border border-cyan-500/20 border-t-cyan-400 pointer-events-none"></div>

    <!-- Pulsierender Leuchteffekt im Hintergrund -->
    <div class="orb-glow-bg absolute w-[220px] h-[220px] md:w-[280px] md:h-[280px] rounded-full bg-cyan-500/20 blur-xl group-hover:bg-cyan-400/40 transition-all duration-300 pointer-events-none"></div>
    
    <!-- Haupt-GIF (Gefüllte Größe) -->
    <img src="./jarvis-orb.gif" alt="JARVIS Orb" class="jarvis-orb-main relative z-10 w-[220px] h-[220px] md:w-[280px] md:h-[280px] object-cover rounded-full border-2 border-cyan-400/60 shadow-[0_0_35px_rgba(0,240,255,0.6)] transition-transform duration-200 group-hover:scale-105 group-active:scale-95">
  </button>
  
  <div class="text-xs text-cyan-400/90 mt-6 tracking-widest uppercase animate-pulse font-bold">
    [ Zum Sprechen tippen ]
  </div>
</div>

<!-- SYSTEM CHECK HUD MONITOR (Unten Links & Deutlich Größer) -->
<aside id="system-check-widget" class="fixed bottom-4 left-4 z-40 pointer-events-none flex flex-col items-start">
  <div class="hud-panel p-2 rounded-lg border border-cyan-500/50 bg-black/80 backdrop-blur-md shadow-[0_0_20px_rgba(0,240,255,0.3)]">
    <img src="./system-check.gif" alt="System Check" class="w-48 md:w-64 h-auto opacity-90 rounded-sm">
    <div class="text-[11px] font-mono text-cyan-400 mt-1.5 text-left tracking-widest uppercase px-1 font-semibold">
      SYS_MONITOR // ONLINE
    </div>
  </div>
</aside>
