plugins {
    id 'com.android.application'
}

android {
    namespace '__PAKET__'
    compileSdk 34

    defaultConfig {
        applicationId '__PAKET__'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
