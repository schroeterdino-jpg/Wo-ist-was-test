name: Temporaer Kugel-Stempel korrigieren

on:
  push:
    branches:
      - kugel-ruhiger

permissions:
  contents: write

jobs:
  fix-stempel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kugel-ruhiger
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache-Stempel aktualisieren
        run: node tools/stempel.js
      - name: Korrektur committen
        run: |
          if git diff --quiet -- index.html; then
            echo "Kein Stempel-Update notwendig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cache-Stempel fuer Kugel aktualisieren"
          git push origin HEAD:kugel-ruhiger
