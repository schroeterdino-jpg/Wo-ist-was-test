name: Render JARVIS Trailer
on:
  push:
    branches: [jarvis-trailer]
    paths:
      - 'jarvis-trailer/**'
      - '.github/workflows/render-jarvis-trailer.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-trailer/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install trailer dependencies
        working-directory: jarvis-trailer
        run: npm install --no-audit --no-fund
      - name: Generate original sci-fi soundtrack
        working-directory: jarvis-trailer
        run: bash make-soundtrack.sh
      - name: Render MP4
        working-directory: jarvis-trailer
        run: npm run render
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Trailer-1080x1920
          path: jarvis-trailer/out/jarvis-trailer.mp4
          retention-days: 14
