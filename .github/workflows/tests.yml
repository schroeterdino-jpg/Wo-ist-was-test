name: App-Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/hintergrund_6b2.js liest mit `git show 4d5b9e6:js/synapsen.js` den Stand vor Phase 6B.2; ein flacher Klon kennt den Commit nicht
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/lauf.js
      - run: node tests/aktionen.js
      - run: node tests/aktionen_kette.js
      - run: node tests/jarvis_pruefstrecke.js
      - run: node tests/faehigkeiten.js
      - run: node tests/handyapp.js
      - run: node tests/antwort.js
      - run: node tests/mehrfachfrage.js
      - run: node tests/meldungen.js
      - run: node tests/regeln.js
      - run: node tests/c1_stufe1.js
      - run: node tests/reihenfolge.js
      - run: node tests/timer.js
      - run: node tests/landkarte.js
      - run: node tests/sprache.js
      - run: node tests/globale.js
      - run: node tests/wirkungslos.js
      - run: node tests/suche.js
      - run: node tests/kitext.js
      - run: node tests/hintergrund.js
      - run: node tests/hintergrund_6b1.js
      - run: node tests/hintergrund_6b2.js
      - run: node tests/memory7a.js
      - run: node tests/memory7b.js
      - run: node tests/inventar8a.js
