name: App-Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gruppe:
    # Die Tests laufen in 5 Gruppen gleichzeitig (spart etwa die Hälfte der Zeit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gruppe: [A, B, C, D, E]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # voller Verlauf bleibt an (frühere Tests lasen mit `git show` alte Stände); schadet nicht
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: matrix.gruppe == 'A'
        run: |
          node tests/inventar8a.js
      - if: matrix.gruppe == 'B'
        run: |
          node tests/c1_stufe1.js
          node tests/regeln.js
      - if: matrix.gruppe == 'C'
        run: |
          node tests/aktionen.js
          node tests/memory7b.js
          node tests/aktionen_kette.js
      - if: matrix.gruppe == 'D'
        run: |
          node tests/meldungen.js
          node tests/sprache.js
          node tests/hintergrund.js
          node tests/memory7a.js
      - if: matrix.gruppe == 'E'
        run: |
          node tests/antwort.js
          node tests/dirigent_fragen.js
          node tests/faehigkeiten.js
          node tests/globale.js
          node tests/handyapp.js
          node tests/jarvis_pruefstrecke.js
          node tests/kitext.js
          node tests/landkarte.js
          node tests/lauf.js
          node tests/mehrfachfrage.js
          node tests/pending_reihenfolge.js
          node tests/pending_zweite_stufe.js
          node tests/reihenfolge.js
          node tests/stromtest.js
          node tests/suche.js
          node tests/timer.js
          node tests/uebersicht.js
          node tests/vercelignore.js
          node tests/verkehr.js
          node tests/wirkungslos.js

  tests:
    # Sammelstelle: grün, wenn alle Gruppen grün sind
    needs: gruppe
    runs-on: ubuntu-latest
    steps:
      - run: echo "Alle Test-Gruppen grün"
