name: App-Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    outputs:
      aktualisiert: ${{ steps.commit.outputs.aktualisiert }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Stempel und Golden Master vor den Tests erzeugen
        run: |
          node tools/stempel.js
          node tests/inventar8a.js --schreiben
          node tools/stempel.js --pruefen
          node tests/inventar8a.js
      - name: Generierte Dateien committen
        id: commit
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          git add -- index.html tests/inventar8a_soll.json
          if git diff --cached --quiet; then
            echo 'aktualisiert=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: Cache-Stempel und Golden Master vor Tests aktualisieren'
          # Parallele PR-Commits können zwischen Checkout und Push eintreffen.
          # In diesem Fall den neuesten Branch integrieren und erneut versuchen.
          for versuch in 1 2 3 4 5; do
            git fetch origin "${{ github.event.pull_request.head.ref || github.ref_name }}"
            git rebase FETCH_HEAD
            if git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"; then
              break
            fi
            if [ "$versuch" -eq 5 ]; then
              echo "Push nach 5 Versuchen fehlgeschlagen" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'aktualisiert=true' >> "$GITHUB_OUTPUT"
      - name: Neuen Bot-Commit durch regulären Testlauf prüfen
        if: steps.commit.outputs.aktualisiert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref "${{ github.event.pull_request.head.ref || github.ref_name }}"

  gruppe:
    # Die Tests laufen in 5 Gruppen gleichzeitig (spart etwa die Hälfte der Zeit)
    needs: vorbereiten
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gruppe: [A, B, C, D, E]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0   # nach der Vorbereitung stets den aktualisierten Branch testen
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: matrix.gruppe == 'A'
        run: |
          node tests/inventar8a.js
      - if: matrix.gruppe == 'B'
        run: |
          node tests/c1_stufe1.js
          node tests/regeln.js
      - if: matrix.gruppe == 'C'
        run: |
          node tests/aktionen.js
          node tests/memory7b.js
          node tests/aktionen_kette.js
      - if: matrix.gruppe == 'D'
        run: |
          node tests/meldungen.js
          node tests/sprache.js
          node tests/hintergrund.js
          node tests/memory7a.js
      - if: matrix.gruppe == 'E'
        run: |
          node tests/antwort.js
          node tests/aktionserfolg.js
          node tests/ausflug_agent.js
          node tests/ausflug_zielort.js
          node tests/gespraechsfaden.js
          node tests/anschlussfragen.js
          node tests/produktkarten.js
          node tests/haendlerlinks.js
          node tests/chef_kette.js
          node tests/chef_produkt.js
          node tests/foto_werkzeuge.js
          node tests/chef_fahrzeit.js
          node tests/antwort_text.js
          node tests/chef_dirigent.js
          node tests/mitnehmen_briefing.js
          node tests/schicht_freier_tag.js
          node tests/schicht_zeiten.js
          node tests/schicht_einstellungen.js
          node tests/gespraech_lokal.js
          node tests/chef_lesen.js
          node tests/fehlgriffe.js
          node tests/chef_lesen2.js
          node tests/luecken.js
          node tests/ausflug_folge.js
          node tests/einkaufszettel.js
          node tests/avatar_roboter.js
          node tests/wecken_woerter.js
          node tests/vertretung_pausen.js
          node tests/mitlauf.js
          node tests/langtermin.js
          node tests/korrektur.js
          node tests/abfahrt_kurz.js
          node tests/mail_loeschen.js
          node tests/foto_produkt.js
          node tests/foto_lens.js
          node tests/sicherheit.js
          node tests/registry.js
          node tests/schatten.js
          node tests/gespraech.js
          node tests/gespraech_ort.js
          node tests/schatten_ansicht.js
          node tests/chef.js
          node tests/chef_diagnose.js
          node tests/werkstatt_fallback.js
          node tests/heimweg_karte.js
          node tests/chef_b2a.js
          node tests/chef_mehrteilig.js
          node tests/chef_b2b.js
          node tests/chef_b2b2.js
          node tests/termin_verschieben_fix.js
          node tests/selbstdiagnose_sprachbefehle.js
          node tests/chef_paket.js
          node tests/schreibkern.js
          node tests/dirigent_fragen.js
          node tests/faehigkeiten.js
          node tests/globale.js
          node tests/handyapp.js
          node tests/jarvis_pruefstrecke.js
          node tests/kitext.js
          node tests/prompt_wissen.js
          node tests/chef_parkplatz.js
          node tests/chef_wecker.js
          node tests/chef_einkauf.js
          node tests/weltuhr_reine_frage.js
          node tests/kontakte_xss.js
          node tests/landkarte.js
          node tests/lauf.js
          node tests/mehrfachfrage.js
          node tests/fragen_weg.js
          node tests/pending_reihenfolge.js
          node tests/pending_zweite_stufe.js
          node tests/reihenfolge.js
          node tests/stromtest.js
