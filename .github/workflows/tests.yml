name: App-Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node -v && echo "::notice::node=$(node -v) tz=$(date +%Z) cpus=$(nproc)"
      - name: diag hintergrund_6b2
        if: always()
        run: |
          node tests/hintergrund_6b2.js > /tmp/o.txt 2>&1 || echo "::error title=hintergrund_6b2::$(head -c 2500 /tmp/o.txt | tr '\n' '~')"
      - name: diag memory7a
        if: always()
        run: |
          node tests/memory7a.js > /tmp/o.txt 2>&1 || echo "::error title=memory7a::$(head -c 2500 /tmp/o.txt | tr '\n' '~')"
      - name: diag memory7b
        if: always()
        run: |
          node tests/memory7b.js > /tmp/o.txt 2>&1 || echo "::error title=memory7b::$(head -c 2500 /tmp/o.txt | tr '\n' '~')"
      - name: diag inventar8a
        if: always()
        run: |
          node tests/inventar8a.js > /tmp/o.txt 2>&1 || echo "::error title=inventar8a::$(head -c 2500 /tmp/o.txt | tr '\n' '~')"
      - name: diag sprache
        if: always()
        run: |
          node tests/sprache.js > /tmp/o.txt 2>&1 || echo "::error title=sprache::$(head -c 2500 /tmp/o.txt | tr '\n' '~')"
      - name: diag globale
        if: always()
        run: |
          node tests/globale.js > /tmp/o.txt 2>&1 || echo "::error title=globale::$(head -c 2500 /tmp/o.txt | tr '\n' '~')"
