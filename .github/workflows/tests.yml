name: App-Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/lauf.js
      - run: node tests/jarvis_pruefstrecke.js
      - run: node tests/faehigkeiten.js
