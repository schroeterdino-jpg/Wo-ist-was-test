name: Temporaer Kugel-Inventar aktualisieren

on:
  push:
    branches:
      - kugel-ruhiger

permissions:
  contents: write

jobs:
  aktualisieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kugel-ruhiger
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Golden Master auf echten Endstand aktualisieren
        run: |
          rm .github/workflows/tmp-kugel-inventar.yml
          node tools/stempel.js
          node tests/inventar8a.js --schreiben
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Kugel-Inventar und Cache-Stempel aktualisieren"
          git push origin HEAD:kugel-ruhiger
