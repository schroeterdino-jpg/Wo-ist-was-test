name: Branches aufräumen
# Von Hand starten (Actions > "Branches aufräumen" > Run workflow). Löscht NUR Branches, deren Pull Request schon gemergt ist
# und deren Spitze genau dem gemergten Stand entspricht (es geht also nichts verloren; der Pull Request bleibt, der Branch lässt sich dort wiederherstellen).
# Nie gelöscht werden: main, Branches mit offenem Pull Request und Branches mit späteren, nicht gemergten Änderungen.
on:
  workflow_dispatch:
    inputs:
      nur_anzeigen:
        description: 'Nur anzeigen, nichts löschen (true/false)'
        default: 'false'
permissions:
  contents: write
  pull-requests: read
jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Gemergte Branches löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUR_ANZEIGEN: ${{ inputs.nur_anzeigen }}
        run: |
          set -e
          : > merged.txt; : > branches.txt
          for p in 1 2 3 4 5 6; do
            gh api "repos/$REPO/pulls?state=closed&per_page=100&page=$p" --jq ".[]|select(.merged_at!=null and .head.repo.full_name==\"$REPO\")|\"\(.head.ref) \(.head.sha)\"" >> merged.txt
          done
          for p in 1 2 3 4 5 6; do
            gh api "repos/$REPO/branches?per_page=100&page=$p" --jq '.[]|"\(.name) \(.commit.sha)"' >> branches.txt
          done
          gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref' > offen.txt
          n=0; weg=0
          while read -r name sha; do
            n=$((n+1))
            [ "$name" = "main" ] && continue
            grep -qxF "$name" offen.txt && continue
            if grep -qxF "$name $sha" merged.txt; then
              weg=$((weg+1))
              if [ "$NUR_ANZEIGEN" = "true" ]; then echo "würde löschen: $name"; else gh api -X DELETE "repos/$REPO/git/refs/heads/$name" >/dev/null && echo "gelöscht: $name" || echo "FEHLER: $name"; fi
            fi
          done < branches.txt
          echo "Branches gesamt: $n, davon gemergt und aufgeräumt: $weg"
