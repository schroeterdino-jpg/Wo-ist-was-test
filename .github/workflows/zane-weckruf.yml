name: Zane Weckruf APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zane-weckruf.yml'
      - 'weckruf-src/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt anlegen
        run: |
          mkdir -p weckruf/app/src/main/java/de/dino/zaneweckruf weckruf/app/src/main/res/drawable-nodpi
          S=weckruf-src
          cp $S/*.java weckruf/app/src/main/java/de/dino/zaneweckruf/
          cp $S/AndroidManifest.xml weckruf/app/src/main/AndroidManifest.xml
          cp $S/ic_launcher.png weckruf/app/src/main/res/drawable-nodpi/ic_launcher.png
          cp $S/app-build.gradle weckruf/app/build.gradle
          cp $S/projekt-build.gradle weckruf/build.gradle
          cp $S/gradle.properties weckruf/gradle.properties
          cp $S/settings.gradle weckruf/settings.gradle
          ls -R weckruf | head -40

      - name: Signatur-Schluessel anlegen
        run: |
          cd weckruf
          echo '' | base64 -d > app/zane.jks

      - name: Sprachmodell laden
        run: |
          cd weckruf
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model
          rm model.zip
          du -sh app/src/main/assets/model

      - name: APK bauen
        run: |
          cd weckruf
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            grep -E "error:|What went wrong" -A4 build.log | head -60
            exit 1
          }

      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp weckruf/app/build/outputs/apk/debug/app-debug.apk Zane-Weckruf.apk
          gh release create "weckruf-${{ github.run_number }}" Zane-Weckruf.apk --repo "${{ github.repository }}" --title "Zane Weckruf ${{ github.run_number }}" --notes "Debug-APK der Weckruf-App"
