name: Zane Weckruf APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zane-weckruf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt anlegen
        run: |
          mkdir -p weckruf && cd weckruf
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'ZANE_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'de.dino.zaneweckruf'
              compileSdk 34

              defaultConfig {
                  applicationId 'de.dino.zaneweckruf'
                  minSdk 26
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
                  versionName '1.0'
              }

              signingConfigs {
                  zane {
                      storeFile file('zane.jks')
                      storePassword 'zaneweckruf'
                      keyAlias 'zane'
                      keyPassword 'zaneweckruf'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.zane
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              androidResources {
                  noCompress 'mdl', 'fst', 'conf', 'int', 'txt', 'mat', 'stats', 'ie', 'dubm', 'raw'
              }
          }

          dependencies {
              implementation 'com.alphacephei:vosk-android:0.3.47'
              implementation 'net.java.dev.jna:jna:5.13.0@aar'
          }
          ZANE_EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'ZANE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="Zane"
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SetupActivity"
                      android:label="Zane Einstellungen"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.Light">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WakeService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          ZANE_EOF
          mkdir -p $(dirname app/src/main/java/de/dino/zaneweckruf/MainActivity.java)
          cat > app/src/main/java/de/dino/zaneweckruf/MainActivity.java <<'ZANE_EOF'
          package de.dino.zaneweckruf;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;

          /** Zeigt Zane (die Webseite) im eigenen Fenster. Ton ohne Berührung erlaubt, Spracherkennung nativ. */
          public class MainActivity extends Activity {

              static final String ZANE_URL = "https://wo-ist-was-test.vercel.app/";
              static MainActivity current;
              static boolean pendingWake = false;

              private WebView web;
              private final Handler h = new Handler(Looper.getMainLooper());
              private SpeechRecognizer recognizer;
              private boolean recRunning = false;
              private boolean recAborted = false;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  current = this;
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  setContentView(web, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings st = web.getSettings();
                  st.setJavaScriptEnabled(true);
                  st.setDomStorageEnabled(true);
                  st.setDatabaseEnabled(true);
                  st.setMediaPlaybackRequiresUserGesture(false);
                  st.setGeolocationEnabled(true);
                  st.setJavaScriptCanOpenWindowsAutomatically(true);
                  st.setSupportMultipleWindows(true);
                  st.setAllowFileAccess(false);

                  web.addJavascriptInterface(new ZaneBridge(this), "ZaneNative");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return handleUrl(r.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          cb.invoke(origin, true, false);
                      }

                      @Override
                      public boolean onCreateWindow(WebView v, boolean dialog, boolean userGesture, Message resultMsg) {
                          WebView tmp = new WebView(MainActivity.this);
                          tmp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v2, WebResourceRequest r) {
                                  openExternal(r.getUrl());
                                  v2.destroy();
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v2, String url, android.graphics.Bitmap b) {
                                  if (url != null && !url.equals("about:blank")) {
                                      openExternal(Uri.parse(url));
                                      v2.stopLoading();
                                      v2.destroy();
                                  }
                              }
                          });
                          WebView.WebViewTransport t = (WebView.WebViewTransport) resultMsg.obj;
                          t.setWebView(tmp);
                          resultMsg.sendToTarget();
                          return true;
                      }

                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), 77);
                          } catch (Throwable e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadUrl(ZANE_URL);
                  askPermissions();
                  handleIntent(getIntent());
              }

              private boolean handleUrl(Uri u) {
                  String host = u.getHost();
                  if (host != null && host.endsWith("vercel.app") && "https".equals(u.getScheme())) return false;
                  openExternal(u);
                  return true;
              }

              private void openExternal(Uri u) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                  } catch (Throwable ignored) { }
              }

              private void askPermissions() {
                  ArrayList<String> need = new ArrayList<>();
                  String[] all = {Manifest.permission.RECORD_AUDIO, Manifest.permission.ACCESS_FINE_LOCATION};
                  for (String p : all) if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) need.add(p);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      need.add(Manifest.permission.POST_NOTIFICATIONS);
                  if (need.isEmpty()) startWake();
                  else requestPermissions(need.toArray(new String[0]), 1);
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  startWake();
              }

              private void startWake() {
                  if (!Prefs.enabled(this)) return;
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) return;
                  try {
                      startForegroundService(new Intent(this, WakeService.class));
                  } catch (Throwable ignored) { }
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  handleIntent(i);
              }

              private void handleIntent(Intent i) {
                  if (i != null && i.getBooleanExtra("wake", false)) pendingWake = true;
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  current = this;
                  WakeService.setActivityResumed(true);
                  if (pendingWake) {
                      pendingWake = false;
                      runWake();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  WakeService.setActivityResumed(false);
              }

              @Override
              protected void onDestroy() {
                  if (current == this) current = null;
                  if (recognizer != null) { try { recognizer.destroy(); } catch (Throwable ignored) { } recognizer = null; }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else moveTaskToBack(true);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == 77 && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              // ---- Weckwort erkannt: Zane sagt "Ja?" und hört zu ----
              void runWake() {
                  h.postDelayed(() -> js("window.__zaneWakePending=true;if(window.zaneWake)window.zaneWake();"), 400);
              }

              static void wakeFromService(android.content.Context c) {
                  MainActivity a = current;
                  if (a != null && WakeService.activityResumed) {
                      a.runOnUiThread(a::runWake);
                      return;
                  }
                  pendingWake = true;
                  Intent i = new Intent(c, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  i.putExtra("wake", true);
                  try {
                      c.startActivity(i);
                  } catch (Throwable ignored) { }
              }

              private void js(String code) {
                  if (web != null) web.evaluateJavascript(code, null);
              }

              private void send(String type, String json) {
                  js("window.__zaneRec&&window.__zaneRec(" + JSONObject.quote(type) + "," + (json == null ? "null" : json) + ");");
              }

              // ---- Spracherkennung (ersetzt webkitSpeechRecognition) ----
              void nativeRecStart(String lang, int maxAlt) {
                  runOnUiThread(() -> {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          send("error", "{\"error\":\"not-allowed\"}");
                          send("end", null);
                          return;
                      }
                      if (recognizer == null) {
                          recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                          recognizer.setRecognitionListener(listener);
                      }
                      recAborted = false;
                      recRunning = true;
                      WakeService.setRecActive(true);
                      final Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang == null ? "de-DE" : lang);
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, Math.max(1, maxAlt));
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                      h.postDelayed(() -> {
                          if (!recRunning) return;
                          try { recognizer.startListening(i); } catch (Throwable e) { finishRec("audio-capture"); }
                      }, 250);
                  });
              }

              void nativeRecStop() {
                  runOnUiThread(() -> { if (recognizer != null && recRunning) { try { recognizer.stopListening(); } catch (Throwable ignored) { } } });
              }

              void nativeRecAbort() {
                  runOnUiThread(() -> {
                      if (recognizer != null && recRunning) {
                          recAborted = true;
                          try { recognizer.cancel(); } catch (Throwable ignored) { }
                          finishRec(null);
                      }
                  });
              }

              private void finishRec(String error) {
                  recRunning = false;
                  WakeService.setRecActive(false);
                  if (error != null) send("error", "{\"error\":" + JSONObject.quote(error) + "}");
                  send("end", null);
              }

              private final RecognitionListener listener = new RecognitionListener() {
                  @Override public void onReadyForSpeech(Bundle b) { send("start", null); send("audiostart", null); }
                  @Override public void onBeginningOfSpeech() { send("soundstart", null); send("speechstart", null); }
                  @Override public void onRmsChanged(float v) { }
                  @Override public void onBufferReceived(byte[] b) { }
                  @Override public void onEndOfSpeech() { send("speechend", null); send("soundend", null); send("audioend", null); }
                  @Override public void onPartialResults(Bundle b) { }
                  @Override public void onEvent(int t, Bundle b) { }

                  @Override
                  public void onError(int code) {
                      if (!recRunning) return;
                      String e;
                      switch (code) {
                          case SpeechRecognizer.ERROR_NO_MATCH:
                          case SpeechRecognizer.ERROR_SPEECH_TIMEOUT: e = "no-speech"; break;
                          case SpeechRecognizer.ERROR_AUDIO: e = "audio-capture"; break;
                          case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS: e = "not-allowed"; break;
                          case SpeechRecognizer.ERROR_NETWORK:
                          case SpeechRecognizer.ERROR_NETWORK_TIMEOUT:
                          case SpeechRecognizer.ERROR_SERVER: e = "network"; break;
                          case SpeechRecognizer.ERROR_CLIENT:
                          case SpeechRecognizer.ERROR_RECOGNIZER_BUSY: e = "aborted"; break;
                          default: e = "no-speech";
                      }
                      finishRec(e);
                  }

                  @Override
                  public void onResults(Bundle b) {
                      if (!recRunning) return;
                      try {
                          ArrayList<String> t = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION_RESULTS);
                          float[] c = b.getFloatArray(SpeechRecognizer.CONFIDENCE_SCORES);
                          if (t == null || t.isEmpty()) { finishRec("no-speech"); return; }
                          JSONArray alts = new JSONArray();
                          for (int k = 0; k < t.size(); k++) {
                              JSONObject o = new JSONObject();
                              o.put("t", t.get(k));
                              o.put("c", (c != null && k < c.length) ? c[k] : 0.9);
                              alts.put(o);
                          }
                          send("result", alts.toString());
                          finishRec(null);
                      } catch (Throwable e) {
                          finishRec("no-speech");
                      }
                  }
              };
          }
          ZANE_EOF
          mkdir -p $(dirname app/src/main/java/de/dino/zaneweckruf/Prefs.java)
          cat > app/src/main/java/de/dino/zaneweckruf/Prefs.java <<'ZANE_EOF'
          package de.dino.zaneweckruf;

          import android.content.Context;
          import android.content.SharedPreferences;

          final class Prefs {
              private static SharedPreferences sp(Context c) {
                  return c.getSharedPreferences("zane", Context.MODE_PRIVATE);
              }
              static int level(Context c) { return sp(c).getInt("level2", 2); }
              static void setLevel(Context c, int v) { sp(c).edit().putInt("level2", v).apply(); }
              static boolean enabled(Context c) { return sp(c).getBoolean("enabled", true); }
              static void setEnabled(Context c, boolean v) { sp(c).edit().putBoolean("enabled", v).apply(); }
              static String status(Context c) { return sp(c).getString("status", "aus"); }
              static void setStatus(Context c, String s) { sp(c).edit().putString("status", s).apply(); }
              static String last(Context c) { return sp(c).getString("last", "-"); }
              static void setLast(Context c, String s) { sp(c).edit().putString("last", s).apply(); }
              static int hits(Context c) { return sp(c).getInt("hits", 0); }
              static void addHit(Context c) { sp(c).edit().putInt("hits", hits(c) + 1).apply(); }
          }
          ZANE_EOF
          mkdir -p $(dirname app/src/main/java/de/dino/zaneweckruf/SetupActivity.java)
          cat > app/src/main/java/de/dino/zaneweckruf/SetupActivity.java <<'ZANE_EOF'
          package de.dino.zaneweckruf;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;

          public class SetupActivity extends Activity {

              private TextView info;
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Runnable tick = new Runnable() {
                  @Override public void run() { refresh(); h.postDelayed(this, 1500); }
              };

              private void btn(LinearLayout root, String text, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  root.addView(b);
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int p = (int) (16 * getResources().getDisplayMetrics().density);
                  root.setPadding(p, p * 2, p, p);
                  sv.addView(root);
                  setContentView(sv);

                  TextView title = new TextView(this);
                  title.setText("Zane Einstellungen");
                  title.setTextSize(24);
                  root.addView(title);

                  info = new TextView(this);
                  info.setTextSize(16);
                  info.setPadding(0, p, 0, p);
                  root.addView(info);

                  btn(root, "Zane öffnen", v -> startActivity(new Intent(this, MainActivity.class)));
                  btn(root, "Lauschen starten", v -> { Prefs.setEnabled(this, true); startAll(); });
                  btn(root, "Lauschen beenden", v -> {
                      Prefs.setEnabled(this, false);
                      stopService(new Intent(this, WakeService.class));
                      refresh();
                  });
                  btn(root, "„Über anderen Apps einblenden“ erlauben", v ->
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()))));
                  btn(root, "Akku-Optimierung ausschalten", v ->
                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)));

                  TextView sens = new TextView(this);
                  sens.setText("\nEmpfindlichkeit:");
                  root.addView(sens);
                  RadioGroup rg = new RadioGroup(this);
                  String[] names = {"streng (wenige Fehlalarme)", "normal", "empfindlich (auch ähnliche Wörter)"};
                  for (int i = 0; i < names.length; i++) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(names[i]);
                      rb.setId(100 + i);
                      rg.addView(rb);
                  }
                  rg.check(100 + Prefs.level(this));
                  rg.setOnCheckedChangeListener((g, id) -> {
                      Prefs.setLevel(this, id - 100);
                      if (Prefs.enabled(this) && WakeService.inst != null) startAll();
                  });
                  root.addView(rg);
              }

              private void startAll() {
                  ArrayList<String> need = new ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      need.add(Manifest.permission.RECORD_AUDIO);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      need.add(Manifest.permission.POST_NOTIFICATIONS);
                  if (!need.isEmpty()) {
                      requestPermissions(need.toArray(new String[0]), 1);
                      return;
                  }
                  startForegroundService(new Intent(this, WakeService.class));
                  refresh();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) startAll();
                  else info.setText("Ohne Mikrofon-Erlaubnis geht es nicht.");
              }

              private void refresh() {
                  boolean overlay = Settings.canDrawOverlays(this);
                  info.setText("Status: " + Prefs.status(this)
                          + "\nZuletzt gehört: " + Prefs.last(this)
                          + "\nErkennungen: " + Prefs.hits(this)
                          + "\nÜber anderen Apps einblenden: " + (overlay ? "erlaubt" : "NICHT erlaubt"));
              }

              @Override protected void onResume() { super.onResume(); h.post(tick); }
              @Override protected void onPause() { super.onPause(); h.removeCallbacks(tick); }
          }
          ZANE_EOF
          mkdir -p $(dirname app/src/main/java/de/dino/zaneweckruf/WakeService.java)
          cat > app/src/main/java/de/dino/zaneweckruf/WakeService.java <<'ZANE_EOF'
          package de.dino.zaneweckruf;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.vosk.Model;
          import org.vosk.Recognizer;
          import org.vosk.android.RecognitionListener;
          import org.vosk.android.SpeechService;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Locale;

          /** Lauscht im Hintergrund auf "Hey Zane" (Vosk) und weckt Zane. Pausiert, solange Zane spricht oder zuhört. */
          public class WakeService extends Service implements RecognitionListener {

              private static final String CH_LISTEN = "zane_listen";
              private static final String CH_WAKE = "zane_wake";

              // Zustand, den Zane (Seite) und die Spracherkennung melden
              static volatile boolean pageBusy = false;
              static volatile boolean recActive = false;
              static volatile boolean activityResumed = false;
              static volatile long holdUntil = 0;
              static WakeService inst;

              private final Handler main = new Handler(Looper.getMainLooper());
              private Model model;
              private SpeechService speech;
              private PowerManager.WakeLock wakeLock;
              private boolean loading = false;
              private boolean alive = false;
              private boolean startPending = false;
              private long lastTrigger = 0;

              static void setPageBusy(boolean b) { if (pageBusy != b) { pageBusy = b; poke(); } }
              static void setRecActive(boolean b) { recActive = b; poke(); }
              static void setActivityResumed(boolean b) { activityResumed = b; poke(); }

              private static void poke() {
                  final WakeService s = inst;
                  if (s != null) s.main.post(s::evalVosk);
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  inst = this;
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH_LISTEN, "Zane hört zu", NotificationManager.IMPORTANCE_LOW));
                  nm.createNotificationChannel(new NotificationChannel(CH_WAKE, "Hey Zane erkannt", NotificationManager.IMPORTANCE_HIGH));
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(this, CH_LISTEN)
                          .setContentTitle("Zane hört zu")
                          .setContentText("Sag „Hey Zane“")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .build();
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(1, n);
                  }
                  alive = true;
                  if (wakeLock == null) {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "zane:lauschen");
                      wakeLock.acquire();
                  }
                  if (model == null) {
                      loadModel();
                  } else {
                      stopSpeech();   // z. B. nach Änderung der Empfindlichkeit: mit neuer Wortliste neu starten
                      evalVosk();
                  }
                  return START_STICKY;
              }

              private void loadModel() {
                  if (loading) return;
                  loading = true;
                  Prefs.setStatus(this, "lädt Sprachmodell …");
                  new Thread(() -> {
                      try {
                          File dir = new File(getFilesDir(), "model");
                          File marker = new File(dir, ".fertig");
                          if (!marker.exists()) {
                              deleteRec(dir);
                              copyAssets("model", dir);
                              new FileOutputStream(marker).close();
                          }
                          Model m = new Model(dir.getAbsolutePath());
                          main.post(() -> {
                              loading = false;
                              if (!alive) { m.close(); return; }
                              model = m;
                              evalVosk();
                          });
                      } catch (Throwable e) {
                          loading = false;
                          Prefs.setStatus(this, "Fehler beim Laden: " + e);
                      }
                  }).start();
              }

              private void copyAssets(String assetPath, File target) throws Exception {
                  String[] kids = getAssets().list(assetPath);
                  if (kids == null || kids.length == 0) {
                      target.getParentFile().mkdirs();
                      try (InputStream in = getAssets().open(assetPath); OutputStream out = new FileOutputStream(target)) {
                          byte[] buf = new byte[65536];
                          int r;
                          while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                      }
                  } else {
                      target.mkdirs();
                      for (String k : kids) copyAssets(assetPath + "/" + k, new File(target, k));
                  }
              }

              private void deleteRec(File f) {
                  if (!f.exists()) return;
                  File[] kids = f.listFiles();
                  if (kids != null) for (File k : kids) deleteRec(k);
                  f.delete();
              }

              // ---- Wann lauschen wir? Nicht, wenn Zane spricht/zuhört oder die Spracherkennung läuft ----
              private boolean want() {
                  if (!alive || model == null) return false;
                  if (recActive) return false;
                  if (System.currentTimeMillis() < holdUntil) return false;
                  if (activityResumed && pageBusy) return false;
                  return true;
              }

              private final Runnable startRun = () -> {
                  startPending = false;
                  if (want() && speech == null) startSpeech();
              };

              void evalVosk() {
                  if (!want()) {
                      main.removeCallbacks(startRun);
                      startPending = false;
                      if (speech != null) {
                          stopSpeech();
                          Prefs.setStatus(this, "Pause (Zane ist dran)");
                      }
                      if (alive && model != null && System.currentTimeMillis() < holdUntil) {
                          main.postDelayed(this::evalVosk, holdUntil - System.currentTimeMillis() + 100);
                      }
                      return;
                  }
                  if (speech == null && !startPending) {
                      startPending = true;
                      main.postDelayed(startRun, 1500);   // kurz warten, damit Zane-Ton nicht ins Weckwort fällt
                  }
              }

              // ---- Weckwort-Erkennung ----
              private static final String[][] NAMEN = {
                      {"zane", "zain", "zayn"},
                      {"zane", "zain", "zayn", "jane", "sane", "jain"},
                      {"zane", "zain", "zayn", "jane", "sane", "jain", "shane", "cain", "payne", "zen"}
              };
              private static final String[] ABLENKER = {"hey", "hey there", "hey you", "hey man", "hey guys", "hey john", "hey jay",
                      "hey siri", "hey google", "hey alexa", "hey sam", "hey dan", "hey ben", "hey jack", "hey mate", "okay", "hello", "hi there"};

              private String grammar() {
                  StringBuilder g = new StringBuilder("[");
                  for (String n : NAMEN[Prefs.level(this)]) g.append("\"hey ").append(n).append("\", ");
                  for (String d : ABLENKER) g.append("\"").append(d).append("\", ");
                  g.append("\"[unk]\"]");
                  return g.toString();
              }

              private void startSpeech() {
                  stopSpeech();
                  if (model == null || !alive) return;
                  try {
                      Recognizer rec = new Recognizer(model, 16000.0f, grammar());
                      rec.setWords(true);
                      speech = new SpeechService(rec, 16000.0f);
                      speech.startListening(this);
                      Prefs.setStatus(this, "lauscht auf „Hey Zane“");
                  } catch (Throwable e) {
                      speech = null;
                      Prefs.setStatus(this, "Fehler beim Lauschen: " + e);
                  }
              }

              private void stopSpeech() {
                  if (speech != null) {
                      try { speech.stop(); speech.shutdown(); } catch (Throwable ignored) { }
                      speech = null;
                  }
              }

              private void check(String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      String text = o.optString("text", "").toLowerCase(Locale.ROOT).trim();
                      if (text.isEmpty() || text.equals("[unk]")) return;
                      double min = 1.0;
                      JSONArray ws = o.optJSONArray("result");
                      if (ws != null) {
                          for (int k = 0; k < ws.length(); k++) min = Math.min(min, ws.getJSONObject(k).optDouble("conf", 1.0));
                      }
                      int level = Prefs.level(this);
                      String[] teile = text.split("\\s+");
                      boolean passt = false;
                      if (teile.length == 2 && teile[0].equals("hey")) {
                          for (String n : NAMEN[level]) if (n.equals(teile[1])) passt = true;
                      }
                      double noetig = level == 0 ? 0.8 : (level == 1 ? 0.6 : 0.4);
                      String info = text + " (" + String.format(Locale.US, "%.2f", min) + ")";
                      if (passt && min >= noetig) {
                          Prefs.setLast(this, "erkannt: " + info);
                          trigger();
                      } else {
                          Prefs.setLast(this, "abgelehnt: " + info);
                      }
                  } catch (Throwable ignored) { }
              }

              private void trigger() {
                  long now = System.currentTimeMillis();
                  if (now - lastTrigger < 5000) return;
                  lastTrigger = now;
                  Prefs.addHit(this);
                  holdUntil = now + 8000;   // Zane braucht einen Moment, bis er "Ja?" sagt und als beschäftigt gilt
                  stopSpeech();
                  Prefs.setStatus(this, "Hey Zane erkannt");
                  try {
                      new ToneGenerator(AudioManager.STREAM_NOTIFICATION, 80).startTone(ToneGenerator.TONE_PROP_BEEP, 150);
                  } catch (Throwable ignored) { }
                  if (!android.provider.Settings.canDrawOverlays(this) && !activityResumed) {
                      // Notlösung: Ohne "Über anderen Apps einblenden" darf Android Zane nicht von selbst nach vorn holen
                      try {
                          Intent i = new Intent(this, MainActivity.class).putExtra("wake", true)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          PendingIntent pi = PendingIntent.getActivity(this, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          Notification n = new Notification.Builder(this, CH_WAKE)
                                  .setContentTitle("Hey Zane erkannt")
                                  .setContentText("Tippen, um Zane zu öffnen")
                                  .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                                  .setCategory(Notification.CATEGORY_ALARM)
                                  .setAutoCancel(true)
                                  .setContentIntent(pi)
                                  .setFullScreenIntent(pi, true)
                                  .build();
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          nm.notify(2, n);
                          main.postDelayed(() -> nm.cancel(2), 30000);
                      } catch (Throwable ignored) { }
                  }
                  MainActivity.wakeFromService(this);
                  main.postDelayed(this::evalVosk, 8200);
              }

              @Override public void onPartialResult(String hypothesis) { }
              @Override public void onResult(String hypothesis) { check(hypothesis); }
              @Override public void onFinalResult(String hypothesis) { }
              @Override public void onError(Exception exception) { Prefs.setStatus(this, "Fehler: " + exception); }
              @Override public void onTimeout() { }

              @Override
              public void onDestroy() {
                  alive = false;
                  inst = null;
                  main.removeCallbacksAndMessages(null);
                  stopSpeech();
                  if (model != null) { model.close(); model = null; }
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  wakeLock = null;
                  Prefs.setStatus(this, "aus");
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
