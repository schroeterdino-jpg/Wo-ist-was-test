          ZANE_EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'ZANE_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ZANE_EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'ZANE_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          ZANE_EOF
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'ZANE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZaneWeckruf"
          include ':app'
          ZANE_EOF

      - name: Signatur-Schluessel anlegen
        run: |
          cd weckruf
          echo '' | base64 -d > app/zane.jks

      - name: Sprachmodell laden
        run: |
          cd weckruf
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model
          rm model.zip
          du -sh app/src/main/assets/model

      - name: APK bauen
        run: |
          cd weckruf
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            grep -E "error:|What went wrong" -A4 build.log | head -60
            exit 1
          }

      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp weckruf/app/build/outputs/apk/debug/app-debug.apk Zane-Weckruf.apk
          gh release create "weckruf-${{ github.run_number }}" Zane-Weckruf.apk --repo "${{ github.repository }}" --title "Zane Weckruf ${{ github.run_number }}" --notes "Debug-APK der Weckruf-App"
