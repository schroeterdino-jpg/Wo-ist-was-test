name: Temporaer Kugel-Inventar Branch aktualisieren

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kugel-ruhiger
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kugel-Branch sauber aktualisieren
        run: |
          rm -f .github/workflows/tmp-kugel-inventar.yml
          node tools/stempel.js
          node tests/inventar8a.js --schreiben
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Kugel-Inventar auf neuen Stand aktualisieren"
          git push origin HEAD:kugel-ruhiger
